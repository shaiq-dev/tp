name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build every platform
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Sign the manifest
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          key="$(mktemp)"
          printf '%s\n' "$MINISIGN_KEY" | sed '/^[[:space:]]*$/d' > "$key"
          echo "$MINISIGN_PASSWORD" | minisign -Sm dist/manifest.json -s "$key"
          shred -u "$key"

      - name: Publish the install script and its checksum
        run: |
          cp install.sh dist/
          sha256sum install.sh | tee -a dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/manifest.json
            dist/manifest.json.minisig
            dist/SHA256SUMS
            dist/install.sh
