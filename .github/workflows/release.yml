name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build every platform
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Publish the install script and its checksum
        run: |
          cp install.sh dist/
          sha256sum install.sh | tee -a dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/manifest.json
            dist/SHA256SUMS
            dist/install.sh
